<text x="40" y="1327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="normal" fill="#66707a" text-anchor="start">노드 실행 실패는 retry:&lt;노드&gt;로 재시도한다. Supervisor 진입이 MAX_STEPS(20)를 넘으면 조사를 멈추고 종합·보고서·평가까지 마친 뒤 끝낸다.</text>
