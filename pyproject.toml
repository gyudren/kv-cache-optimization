[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-cache-evaluation"
version = "0.1.0"
description = "SKALA MLA vs ITME evidence-grounded multi-agent evaluation"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2", "openai>=1.50", "pydantic>=2",
  "pypdf>=4", "sentence-transformers>=3", "faiss-cpu>=1.8",
  "rank-bm25>=0.2", "tavily-python>=0.5", "python-dotenv>=1", "reportlab>=4",
  "requests", "pdfplumber", "ddgs", "chromadb",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
